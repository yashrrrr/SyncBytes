name: Deploy Production AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-infra-and-apps:
    name: Build & Push Docker Images to Amazon ECR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Build and push sync server
          docker build -t $ECR_REGISTRY/syncbytes-sync-server:latest -f apps/sync-server/Dockerfile .
          docker push $ECR_REGISTRY/syncbytes-sync-server:latest

          # Build and push Next.js web
          docker build -t $ECR_REGISTRY/syncbytes-web:latest -f apps/web/Dockerfile .
          docker push $ECR_REGISTRY/syncbytes-web:latest

      - name: Trigger ECS Rolling Update
        run: |
          aws ecs update-service --cluster syncbytes-cluster --service syncbytes-app-service --force-new-deployment
