name: Deploy Production AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra-and-apps:
    name: Deploy to AWS Fargate Spot
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init & Apply
        working-directory: infra/terraform
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Build and push sync server
          docker build -t $ECR_REGISTRY/syncbytes-sync-server:latest -f apps/sync-server/Dockerfile .
          docker push $ECR_REGISTRY/syncbytes-sync-server:latest

          # Build and push Next.js web
          docker build -t $ECR_REGISTRY/syncbytes-web:latest -f apps/web/Dockerfile .
          docker push $ECR_REGISTRY/syncbytes-web:latest

      - name: Trigger ECS Rolling Update
        run: |
          aws ecs update-service --cluster syncbytes-cluster --service syncbytes-sync-server --force-new-deployment
          aws ecs update-service --cluster syncbytes-cluster --service syncbytes-web --force-new-deployment
